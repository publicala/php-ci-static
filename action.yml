name: 'publicala/php-ci-static'
description: >-
  Install a pre-built static PHP CLI from publicala/php-ci-static, validate a
  container-provided PHP runtime, or install PHP through Homebrew on macOS.
author: 'publicala'
branding:
  icon: 'cpu'
  color: 'blue'

inputs:
  php-version:
    description: 'PHP series. Static: 8.3, 8.4, or 8.5. System: 7.4 or 8.1 through 8.5. Homebrew: 8.1 through 8.5.'
    required: true
  runtime:
    description: 'Runtime source: static, system, or homebrew'
    required: false
    default: 'static'
  coverage:
    description: 'Coverage driver: none, pcov, or xdebug'
    required: false
    default: 'none'
  ini-values:
    description: 'PHP ini directives, comma- or newline-separated. e.g. `memory_limit=512M, opcache.enable_cli=1`. Values may contain commas in two ways. Wrap the value in single or double quotes (`disable_functions="exec,passthru"`), matching `shivammathur/setup-php`, or rely on the smart-split fallback, which only treats commas that precede a `<directive>=` as separators (so unquoted `disable_functions=exec,passthru` also works). Composes with `coverage:` (both load from the same scan dir).'
    required: false
    default: ''

outputs:
  runtime-cache-hit:
    description: The string "true" when the PHP runtime cache was an exact match.
    value: ${{ steps.runtime-cache.outputs.cache-hit || 'false' }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      id: strategy
      shell: bash
      env:
        PHP_VERSION: ${{ inputs.php-version }}
        RUNTIME: ${{ inputs.runtime }}
        COVERAGE: ${{ inputs.coverage }}
        INI_VALUES: ${{ inputs.ini-values }}
      run: |
        set -euo pipefail
        case "$PHP_VERSION" in
          7.4|8.1|8.2|8.3|8.4|8.5) ;;
          *)
            echo "::error::php-version must be one of 7.4, 8.1, 8.2, 8.3, 8.4, 8.5 (got '$PHP_VERSION')"
            exit 1
            ;;
        esac
        case "$RUNTIME" in
          static|system|homebrew) ;;
          *)
            echo "::error::runtime must be one of static, system, homebrew (got '$RUNTIME')"
            exit 1
            ;;
        esac
        case "$COVERAGE" in
          none|pcov|xdebug) ;;
          *)
            echo "::error::coverage must be one of none, pcov, xdebug (got '$COVERAGE')"
            exit 1
            ;;
        esac
        case "$RUNTIME" in
          static)
            case "$PHP_VERSION" in
              8.3|8.4|8.5) ;;
              *)
                echo "::error::runtime=static supports php-version 8.3, 8.4, or 8.5 (got '$PHP_VERSION')"
                exit 1
                ;;
            esac
            if [[ "$(uname -s)" != "Linux" || "$(uname -m)" != "x86_64" ]]; then
              echo "::error::runtime=static requires Linux/x86_64 (got $(uname -s)/$(uname -m))"
              exit 1
            fi
            ;;
          system)
            if [[ "$COVERAGE" != "none" || -n "$INI_VALUES" ]]; then
              echo "::error::runtime=system supports coverage=none and empty ini-values only"
              exit 1
            fi
            ;;
          homebrew)
            case "$PHP_VERSION" in
              8.1|8.2|8.3|8.4|8.5) ;;
              *)
                echo "::error::runtime=homebrew supports php-version 8.1 through 8.5 (got '$PHP_VERSION')"
                exit 1
                ;;
            esac
            if [[ "$(uname -s)" != "Darwin" ]]; then
              echo "::error::runtime=homebrew requires macOS (got $(uname -s))"
              exit 1
            fi
            if ! command -v brew >/dev/null 2>&1; then
              echo "::error::runtime=homebrew requires Homebrew"
              exit 1
            fi
            if [[ "$COVERAGE" != "none" || -n "$INI_VALUES" ]]; then
              echo "::error::runtime=homebrew supports coverage=none and empty ini-values only"
              exit 1
            fi
            ;;
        esac
        if [[ -n "$INI_VALUES" ]]; then
          # Shape-check only; the install step renders the same input into
          # the scan dir. Parser details live with the shared function.
          # shellcheck disable=SC1090,SC1091
          source "$GITHUB_ACTION_PATH/scripts/runtime-assets.bash"
          php_ci_static_render_ini_values "$INI_VALUES" >/dev/null
        fi
        echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"

    - name: Resolve release
      id: release
      if: steps.strategy.outputs.runtime == 'static'
      shell: bash
      env:
        PHP_VERSION: ${{ inputs.php-version }}
      run: |
        set -euo pipefail

        # Pointer resolution, the latest-X.Y fallback, and the same-series
        # guard live with the shared resolver, which install-php.bash also
        # uses. The installed binary is additionally asserted below.
        # shellcheck disable=SC1090,SC1091
        source "$GITHUB_ACTION_PATH/scripts/runtime-assets.bash"
        BASE="$(php_ci_static_resolve_release_base "$PHP_VERSION")"

        TAG="${BASE##*/}"
        SUMS_DIR="$RUNNER_TEMP/php-ci-static-release"
        rm -rf "$SUMS_DIR"
        mkdir -p "$SUMS_DIR"
        curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL \
          -o "$SUMS_DIR/SHA256SUMS" "$BASE/SHA256SUMS"

        SUMS_HASH="$(sha256sum "$SUMS_DIR/SHA256SUMS" | awk '{ print $1 }')"
        CACHE_KEY="php-ci-static-runtime-v2-${RUNNER_OS}-${RUNNER_ARCH}-${TAG}-${SUMS_HASH}"
        CACHE_PATH="${RUNNER_TEMP}/php-ci-static-runtime-cache/${TAG}/${SUMS_HASH}"

        {
          echo "base=$BASE"
          echo "tag=$TAG"
          echo "sums-hash=$SUMS_HASH"
          echo "cache-key=$CACHE_KEY"
          echo "cache-path=$CACHE_PATH"
          echo "sums-path=$SUMS_DIR/SHA256SUMS"
        } >> "$GITHUB_OUTPUT"

    - name: Restore runtime cache
      id: runtime-cache
      if: steps.strategy.outputs.runtime == 'static'
      uses: actions/cache/restore@v5
      continue-on-error: true
      with:
        path: ${{ steps.release.outputs.cache-path }}
        key: ${{ steps.release.outputs.cache-key }}

    - name: Report runtime cache restore failure
      if: steps.strategy.outputs.runtime == 'static' && steps.runtime-cache.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::PHP runtime cache restore failed. Continuing with release asset downloads."

    - name: Install static PHP
      id: install
      if: steps.strategy.outputs.runtime == 'static'
      shell: bash
      env:
        PHP_VERSION: ${{ inputs.php-version }}
        COVERAGE: ${{ inputs.coverage }}
        INI_VALUES: ${{ inputs.ini-values }}
        BASE: ${{ steps.release.outputs.base }}
        TAG: ${{ steps.release.outputs.tag }}
        FRESH_SUMS: ${{ steps.release.outputs.sums-path }}
        DIST: ${{ steps.release.outputs.cache-path }}
        CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail

        ROOT="$RUNNER_TEMP/php-ci-static"
        BIN="$ROOT/bin"
        CONFD="$ROOT/conf.d"
        WORK="$(mktemp -d)"
        trap 'rm -rf "$WORK"' EXIT

        # shellcheck disable=SC1090,SC1091
        source "$GITHUB_ACTION_PATH/scripts/runtime-assets.bash"

        # Idempotent: clean before staging in case the action runs twice in one job.
        rm -rf "$ROOT"
        mkdir -p "$BIN" "$CONFD" "$DIST"

        # CI baseline ini, loaded first by alphabetical scan order so user
        # `ini-values` (custom.ini) and `coverage` (coverage.ini) win. The
        # static binary's compiled-in defaults match the upstream php.ini-*
        # templates, where memory_limit=128M is intended for shared-hosting
        # web SAPIs. Ubuntu's php-cli ships memory_limit=-1, and CI workloads
        # (PHPCS, PHPStan, PHPUnit on Laravel-sized codebases) routinely
        # exceed 128M. Without this, PHPCS OOMs mid-run with no visible
        # output when wrappers like duster capture stdout via ob_start, and
        # the job exits 255 silently.
        printf 'memory_limit=-1\n' > "$CONFD/00-ci-defaults.ini"

        if php_ci_static_runtime_cache_is_ready "$FRESH_SUMS" "$DIST"; then
          echo "Using cached PHP runtime assets for ${TAG}."
          cp "$FRESH_SUMS" "$DIST/SHA256SUMS"
        else
          if [[ "$CACHE_HIT" == "true" ]]; then
            echo "::warning::restored PHP runtime cache for ${TAG} did not verify. Downloading fresh assets."
          else
            echo "Downloading PHP runtime assets for ${TAG}."
          fi
          rm -rf "$DIST"
          mkdir -p "$DIST"
          php_ci_static_download_runtime_assets "$BASE" "$FRESH_SUMS" "$DIST" "$WORK"
        fi

        cp "$DIST/php-linux-x86_64" "$BIN/php"
        chmod +x "$BIN/php"
        php_ci_static_install_composer "$BIN"

        if [[ "$COVERAGE" != "none" ]]; then
          asset="${COVERAGE}-linux-x86_64.so"
          cp "$DIST/$asset" "$CONFD/${COVERAGE}.so"

          case "$COVERAGE" in
            pcov)
              printf 'extension=%s/pcov.so\npcov.enabled=1\n' \
                "$CONFD" > "$CONFD/coverage.ini"
              ;;
            xdebug)
              # mode=coverage matches what setup-php does for `coverage: xdebug`.
              # Override inline (-d xdebug.mode=...) for step-debug or other modes.
              printf 'zend_extension=%s/xdebug.so\nxdebug.mode=coverage\n' \
                "$CONFD" > "$CONFD/coverage.ini"
              ;;
          esac
        fi

        if [[ -n "$INI_VALUES" ]]; then
          # Same shared parser the Validate step ran; here its rendered
          # `key=value` lines (quoting rules included) become custom.ini.
          php_ci_static_render_ini_values "$INI_VALUES" > "$CONFD/custom.ini"
        fi

        # Always export the scan dir: even with no coverage and no
        # ini-values, the baseline 00-ci-defaults.ini above needs to be
        # picked up so memory_limit isn't stuck at the binary's 128M default.
        echo "PHP_INI_SCAN_DIR=$CONFD" >> "$GITHUB_ENV"

        # $GITHUB_PATH and $GITHUB_ENV only apply to *subsequent* steps, so
        # re-export locally to make these diagnostics meaningful.
        export PATH="$BIN:$PATH"
        export PHP_INI_SCAN_DIR="$CONFD"

        # Assert the installed binary is the requested series, regardless of how
        # BASE resolved. Catches a mispointed channel or a wrong-series fallback
        # before any consumer step runs against the wrong PHP. The probe helper
        # keeps startup warnings (e.g. pcov disabling a requested JIT) off
        # stdout, where one would land inside this command substitution and
        # corrupt the comparison; rationale on php_ci_static_php_probe in
        # runtime-assets.bash.
        installed="$(php_ci_static_php_probe php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')"
        if [[ "$installed" != "$PHP_VERSION" ]]; then
          echo "::error::installed PHP ${installed} does not match requested php-version ${PHP_VERSION}"
          exit 1
        fi

        php_ci_static_diagnostics

        echo "cache-ready=true" >> "$GITHUB_OUTPUT"

    - name: Use system PHP
      if: steps.strategy.outputs.runtime == 'system'
      shell: bash
      env:
        PHP_VERSION: ${{ inputs.php-version }}
      run: |
        set -euo pipefail

        if ! command -v php >/dev/null 2>&1; then
          echo "::error::runtime=system requires php on PATH"
          exit 1
        fi

        installed="$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')"
        if [[ "$installed" != "$PHP_VERSION" ]]; then
          echo "::error::system PHP ${installed} does not match requested php-version ${PHP_VERSION}"
          exit 1
        fi

        BIN="$RUNNER_TEMP/php-ci-static/bin"
        rm -rf "$BIN"
        # shellcheck disable=SC1090,SC1091
        source "$GITHUB_ACTION_PATH/scripts/runtime-assets.bash"
        php_ci_static_install_composer "$BIN"

        php_ci_static_diagnostics

    - name: Install Homebrew PHP
      if: steps.strategy.outputs.runtime == 'homebrew'
      shell: bash
      env:
        PHP_VERSION: ${{ inputs.php-version }}
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: |
        set -euo pipefail

        # shellcheck disable=SC1090,SC1091
        source "$GITHUB_ACTION_PATH/scripts/runtime-assets.bash"
        formula="$(php_ci_static_homebrew_formula "$PHP_VERSION")"

        if ! brew list --versions "$formula" >/dev/null 2>&1; then
          brew install "$formula"
        fi

        php_bin="$(brew --prefix "$formula")/bin"
        installed="$("$php_bin/php" -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')"
        if [[ "$installed" != "$PHP_VERSION" ]]; then
          echo "::error::Homebrew PHP ${installed} does not match requested php-version ${PHP_VERSION}"
          exit 1
        fi

        BIN="$RUNNER_TEMP/php-ci-static/bin"
        rm -rf "$BIN"
        echo "$php_bin" >> "$GITHUB_PATH"
        export PATH="$php_bin:$PATH"
        php_ci_static_install_composer "$BIN"

        php_ci_static_diagnostics

    - name: Save runtime cache
      id: save-runtime-cache
      if: steps.strategy.outputs.runtime == 'static' && steps.runtime-cache.outputs.cache-hit != 'true' && steps.install.outputs.cache-ready == 'true'
      uses: actions/cache/save@v5
      continue-on-error: true
      with:
        path: ${{ steps.release.outputs.cache-path }}
        key: ${{ steps.release.outputs.cache-key }}

    - name: Report runtime cache save failure
      if: steps.strategy.outputs.runtime == 'static' && steps.save-runtime-cache.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::PHP runtime cache save failed. Future jobs may need to download release assets again."
