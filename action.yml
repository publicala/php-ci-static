name: 'publicala/php-ci-static'
description: >-
  Install a pre-built static PHP CLI from publicala/php-ci-static,
  with optional pcov or xdebug auto-loaded via PHP_INI_SCAN_DIR.
author: 'publicala'
branding:
  icon: 'cpu'
  color: 'blue'

inputs:
  php-version:
    description: 'PHP series: 8.3, 8.4, or 8.5'
    required: true
  coverage:
    description: 'Coverage driver: none, pcov, or xdebug'
    required: false
    default: 'none'
  ini-values:
    description: 'PHP ini directives, comma- or newline-separated. e.g. `memory_limit=512M, opcache.enable_cli=1`. Values may contain commas in two ways. Wrap the value in single or double quotes (`disable_functions="exec,passthru"`), matching `shivammathur/setup-php`, or rely on the smart-split fallback, which only treats commas that precede a `<directive>=` as separators (so unquoted `disable_functions=exec,passthru` also works). Composes with `coverage:` (both load from the same scan dir).'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      env:
        PHP_VERSION: ${{ inputs.php-version }}
        COVERAGE: ${{ inputs.coverage }}
        INI_VALUES: ${{ inputs.ini-values }}
      run: |
        set -euo pipefail
        case "$PHP_VERSION" in
          8.3|8.4|8.5) ;;
          *)
            echo "::error::php-version must be one of 8.3, 8.4, 8.5 (got '$PHP_VERSION')"
            exit 1
            ;;
        esac
        case "$COVERAGE" in
          none|pcov|xdebug) ;;
          *)
            echo "::error::coverage must be one of none, pcov, xdebug (got '$COVERAGE')"
            exit 1
            ;;
        esac
        if [[ "$(uname -s)" != "Linux" || "$(uname -m)" != "x86_64" ]]; then
          echo "::error::publicala/php-ci-static only ships Linux x86_64 binaries (got $(uname -s)/$(uname -m))"
          exit 1
        fi
        if [[ -n "$INI_VALUES" ]]; then
          # Two-pass parser:
          #   1. awk treats `'` / `"` as quote delimiters ONLY when they sit at
          #      "value-start" position (right after `=`, optionally past
          #      whitespace). Quotes appearing later in a value are kept
          #      literal, so `error_log=/tmp/o'reilly.log` stays intact.
          #      Inside a quoted value, commas are replaced with \001 and
          #      the surrounding quote chars are stripped.
          #   2. sed splits on commas that precede a `<directive>=`, so the
          #      unquoted form (`disable_functions=exec,passthru`) also stays
          #      one entry. Newlines are separators too (YAML multiline).
          # The \001 sentinel is restored to a literal comma when writing the
          # ini file in the install step. Here we only check shape.
          printf '%s\n' "$INI_VALUES" \
            | awk '
              BEGIN { sq = sprintf("%c", 39); dq = sprintf("%c", 34); s = sprintf("%c", 1) }
              {
                out = ""; q = ""; at_val_start = 0; n = length($0)
                for (i = 1; i <= n; i++) {
                  c = substr($0, i, 1)
                  if (q != "") {
                    if (c == q) { q = ""; at_val_start = 0; continue }
                    if (c == ",") c = s
                    out = out c
                    continue
                  }
                  if (at_val_start) {
                    if (c == sq || c == dq) { q = c; at_val_start = 0; continue }
                    if (c == " " || c == "\t") { out = out c; continue }
                    out = out c; at_val_start = 0; continue
                  }
                  out = out c
                  if (c == "=") at_val_start = 1
                }
                print out
              }' \
            | sed -E 's/,[[:space:]]*([A-Za-z_][A-Za-z0-9_.]*=)/\n\1/g' \
            | while IFS= read -r raw; do
              pair="$(echo "$raw" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
              [[ -z "$pair" ]] && continue
              if [[ ! "$pair" =~ ^[A-Za-z_][A-Za-z0-9_.]*= ]]; then
                # Restore sentinel commas so the error message shows the input
                # as the user wrote it (minus the stripped quote chars).
                echo "::error::ini-values: expected '<directive>=<value>' but got '${pair//$'\001'/,}'"
                exit 1
              fi
            done
        fi

    - name: Install static PHP
      shell: bash
      env:
        PHP_VERSION: ${{ inputs.php-version }}
        COVERAGE: ${{ inputs.coverage }}
        INI_VALUES: ${{ inputs.ini-values }}
      run: |
        set -euo pipefail

        ROOT="$RUNNER_TEMP/php-ci-static"
        BIN="$ROOT/bin"
        CONFD="$ROOT/conf.d"

        # Resolve the current immutable release for this PHP series from the
        # channel pointer. The organization enforces immutable releases, so
        # binaries ship as one release per patch (php-X.Y.Z) and the pointer
        # names the newest. Fall back to the frozen latest-X.Y release if the
        # pointer cannot be reached, so a transient raw.githubusercontent
        # outage still yields a working, checksum-verified binary.
        POINTER="https://raw.githubusercontent.com/publicala/php-ci-static/channels/${PHP_VERSION}"
        BASE="$(curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL "$POINTER" 2>/dev/null | head -n1 || true)"
        if [[ -z "$BASE" ]]; then
          echo "::warning::could not resolve channel pointer ${POINTER}, falling back to latest-${PHP_VERSION}"
          BASE="https://github.com/publicala/php-ci-static/releases/download/latest-${PHP_VERSION}"
        fi
        # Constrain BASE to this repo's release downloads for the requested
        # series. A pointer that resolves anywhere else, or to a different PHP
        # series (e.g. channels/8.4 pointing at php-8.3.x), is rejected rather
        # than fetched. The installed binary is also asserted below.
        dl="https://github.com/publicala/php-ci-static/releases/download"
        case "$BASE" in
          "$dl/php-${PHP_VERSION}."*) ;;
          "$dl/latest-${PHP_VERSION}") ;;
          *)
            echo "::error::resolved release base does not match php-version ${PHP_VERSION}: ${BASE}"
            exit 1
            ;;
        esac

        # Idempotent: clean before staging in case the action runs twice in one job.
        rm -rf "$ROOT"
        mkdir -p "$BIN" "$CONFD"

        # CI baseline ini, loaded first by alphabetical scan order so user
        # `ini-values` (custom.ini) and `coverage` (coverage.ini) win. The
        # static binary's compiled-in defaults match the upstream php.ini-*
        # templates, where memory_limit=128M is intended for shared-hosting
        # web SAPIs. Ubuntu's php-cli ships memory_limit=-1, and CI workloads
        # (PHPCS, PHPStan, PHPUnit on Laravel-sized codebases) routinely
        # exceed 128M. Without this, PHPCS OOMs mid-run with no visible
        # output when wrappers like duster capture stdout via ob_start, and
        # the job exits 255 silently.
        printf 'memory_limit=-1\n' > "$CONFD/00-ci-defaults.ini"

        cd "$(mktemp -d)"
        curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL -O "$BASE/php-linux-x86_64"
        curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL -O "$BASE/SHA256SUMS"

        # `sha256sum -c --ignore-missing` exits 0 if the assets you downloaded
        # don't appear in SHA256SUMS at all, so we assert the line exists first,
        # then check exactly that line.
        verify() {
          local name="$1"
          if ! grep -Eq "^[0-9a-f]{64}  ${name}$" SHA256SUMS; then
            echo "::error::SHA256SUMS missing entry for ${name}"
            exit 1
          fi
          grep " ${name}$" SHA256SUMS | sha256sum -c -
        }
        verify "php-linux-x86_64"

        chmod +x php-linux-x86_64
        mv php-linux-x86_64 "$BIN/php"
        echo "$BIN" >> "$GITHUB_PATH"

        # composer-stable.phar is a rolling release (no fixed hash to pin
        # against), so we lean on HTTPS to getcomposer.org plus curl's
        # retry policy.
        curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL \
          -o "$BIN/composer" https://getcomposer.org/composer-stable.phar
        chmod +x "$BIN/composer"

        if [[ "$COVERAGE" != "none" ]]; then
          asset="${COVERAGE}-linux-x86_64.so"
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL -O "$BASE/$asset"
          verify "$asset"
          mv "$asset" "$CONFD/${COVERAGE}.so"

          case "$COVERAGE" in
            pcov)
              printf 'extension=%s/pcov.so\npcov.enabled=1\n' \
                "$CONFD" > "$CONFD/coverage.ini"
              ;;
            xdebug)
              # mode=coverage matches what setup-php does for `coverage: xdebug`.
              # Override inline (-d xdebug.mode=...) for step-debug or other modes.
              printf 'zend_extension=%s/xdebug.so\nxdebug.mode=coverage\n' \
                "$CONFD" > "$CONFD/coverage.ini"
              ;;
          esac
        fi

        if [[ -n "$INI_VALUES" ]]; then
          : > "$CONFD/custom.ini"
          # See the matching block in the Validate step for the parser shape.
          # Here we additionally restore the \001 sentinel back to a literal
          # comma in the value before writing the ini file.
          printf '%s\n' "$INI_VALUES" \
            | awk '
              BEGIN { sq = sprintf("%c", 39); dq = sprintf("%c", 34); s = sprintf("%c", 1) }
              {
                out = ""; q = ""; at_val_start = 0; n = length($0)
                for (i = 1; i <= n; i++) {
                  c = substr($0, i, 1)
                  if (q != "") {
                    if (c == q) { q = ""; at_val_start = 0; continue }
                    if (c == ",") c = s
                    out = out c
                    continue
                  }
                  if (at_val_start) {
                    if (c == sq || c == dq) { q = c; at_val_start = 0; continue }
                    if (c == " " || c == "\t") { out = out c; continue }
                    out = out c; at_val_start = 0; continue
                  }
                  out = out c
                  if (c == "=") at_val_start = 1
                }
                print out
              }' \
            | sed -E 's/,[[:space:]]*([A-Za-z_][A-Za-z0-9_.]*=)/\n\1/g' \
            | while IFS='=' read -r key val; do
              key="$(echo "$key" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
              val="$(echo "$val" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
              val="${val//$'\001'/,}"
              [[ -z "$key" ]] && continue
              # PHP's ini parser truncates unquoted values on `=` and treats
              # `;` / `#` as inline comment markers. `'` opens a
              # single-quoted string in PHP's ini lexer too, so values like
              # `/tmp/o'reilly.log` get cut to `/tmp/o` unless wrapped.
              # Wrap in double quotes when any of those appear, plus when
              # the value contains a `"` itself (escaped via \"). Plain
              # values, commas, whitespace, and PHP-constant bitmask
              # expressions like `E_ALL & ~E_NOTICE` are left unquoted so
              # PHP still evaluates them.
              if [[ "$val" == *=*       || "$val" == *';'*    \
                 || "$val" == *'#'*     || "$val" == *'"'*    \
                 || "$val" == *"'"* ]]; then
                val="\"${val//\"/\\\"}\""
              fi
              echo "${key}=${val}" >> "$CONFD/custom.ini"
            done
        fi

        # Always export the scan dir: even with no coverage and no
        # ini-values, the baseline 00-ci-defaults.ini above needs to be
        # picked up so memory_limit isn't stuck at the binary's 128M default.
        echo "PHP_INI_SCAN_DIR=$CONFD" >> "$GITHUB_ENV"

        # $GITHUB_PATH and $GITHUB_ENV only apply to *subsequent* steps, so
        # re-export locally to make these diagnostics meaningful.
        export PATH="$BIN:$PATH"
        export PHP_INI_SCAN_DIR="$CONFD"

        # Assert the installed binary is the requested series, regardless of how
        # BASE resolved. Catches a mispointed channel or a wrong-series fallback
        # before any consumer step runs against the wrong PHP.
        installed="$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')"
        if [[ "$installed" != "$PHP_VERSION" ]]; then
          echo "::error::installed PHP ${installed} does not match requested php-version ${PHP_VERSION}"
          exit 1
        fi

        echo "::group::php -v"
        php -v
        echo "::endgroup::"
        echo "::group::php -m"
        php -m
        echo "::endgroup::"
        echo "::group::php --ini"
        php --ini
        echo "::endgroup::"
        echo "::group::composer --version"
        composer --version
        echo "::endgroup::"
