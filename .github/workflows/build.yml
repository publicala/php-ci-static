name: Build static PHP

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    name: PHP ${{ matrix.php_version }}
    # PHP compilation is CPU-bound; -16 keeps each matrix arm under ~10 min
    # versus ~30 on base. Per pla-stack sizing policy.
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.3', '8.4', '8.5']
    env:
      # Link against glibc instead of musl. musl static binaries
      # cannot dlopen shared extensions (it has no dlopen impl);
      # glibc-linked binaries can. Every Ubuntu / Debian / Depot
      # runner ships glibc, so the binary stays portable across
      # any standard CI runner.
      SPC_LIBC: glibc
      # Static extensions baked into the binary. Tuned to match what
      # Laravel apps actually need so the binary covers the common
      # CI workload (lint, phpstan, pint, tests against MySQL /
      # Postgres / SQLite / Redis) without falling back to a
      # container.
      SPC_STATIC_EXTENSIONS: apcu,bcmath,calendar,ctype,curl,dom,exif,fileinfo,filter,gd,gmp,iconv,intl,mbstring,mysqli,opcache,openssl,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,pgsql,phar,posix,redis,session,simplexml,soap,sockets,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib
      # Shared extensions built as separate .so files. SPC only
      # supports xdebug and pcov as shared modules, never static.
      # Both are zero-cost when not loaded, opt-in when needed.
      SPC_SHARED_EXTENSIONS: xdebug,pcov
    steps:
      - uses: actions/checkout@v6

      - name: Install static-php-cli
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            -o spc https://dl.static-php.dev/static-php-cli/spc-bin/nightly/spc-linux-x86_64
          chmod +x spc
          ./spc --version

      - name: Install build dependencies
        run: ./spc doctor --auto-fix

      - name: Cache spc sources
        uses: actions/cache@v5
        with:
          path: |
            downloads
            source
          key: spc-${{ matrix.php_version }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Download sources
        run: |
          ./spc download \
            --with-php=${{ matrix.php_version }} \
            --for-extensions="$SPC_STATIC_EXTENSIONS,$SPC_SHARED_EXTENSIONS" \
            --prefer-pre-built

      - name: Build CLI + shared extensions
        run: |
          ./spc build "$SPC_STATIC_EXTENSIONS" \
            --build-cli \
            --build-shared="$SPC_SHARED_EXTENSIONS"

      - name: Verify static binary
        run: |
          ls -la buildroot/bin/ buildroot/modules/
          ./buildroot/bin/php -v
          ./buildroot/bin/php -m
          ./buildroot/bin/php -r 'echo "json: ", json_encode(["ok" => true]), PHP_EOL;'
          ./buildroot/bin/php --ri opcache | head -5

      - name: Verify shared extensions load
        run: |
          for ext in xdebug pcov; do
            echo "--- $ext ---"
            ./buildroot/bin/php -d "zend_extension=$PWD/buildroot/modules/$ext.so" --ri "$ext" | head -10
          done

      - name: Capture exact PHP version
        id: ver
        run: |
          exact=$(./buildroot/bin/php -r 'echo PHP_VERSION;')
          echo "exact=$exact" >> "$GITHUB_OUTPUT"
          echo "Built PHP $exact"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp buildroot/bin/php dist/php-linux-x86_64
          cp buildroot/modules/xdebug.so dist/xdebug-linux-x86_64.so
          cp buildroot/modules/pcov.so dist/pcov-linux-x86_64.so
          (cd dist && sha256sum php-linux-x86_64 xdebug-linux-x86_64.so pcov-linux-x86_64.so > SHA256SUMS)
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: php-${{ matrix.php_version }}-linux-x86_64-${{ steps.ver.outputs.exact }}
          path: dist/
          if-no-files-found: error

      - name: Publish sliding release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: latest-${{ matrix.php_version }}
          EXACT: ${{ steps.ver.outputs.exact }}
          SERIES: ${{ matrix.php_version }}
          EXTENSIONS_LIST: ${{ env.SPC_STATIC_EXTENSIONS }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            dist/php-linux-x86_64 \
            dist/xdebug-linux-x86_64.so \
            dist/pcov-linux-x86_64.so \
            dist/SHA256SUMS \
            --title "PHP $EXACT (static, linux x86_64)" \
            --notes "Built by static-php-cli on $(date -u +%FT%TZ)

          PHP: \`$EXACT\` (series \`$SERIES\`)
          Static extensions: \`$EXTENSIONS_LIST\`
          Shared extensions: \`xdebug\`, \`pcov\`
          Runner: \`depot-ubuntu-24.04-16\`
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## Usage

          Default (no coverage, fastest):

          \`\`\`yaml
          - name: Install PHP
            run: |
              curl -fsSL -o php https://github.com/${{ github.repository }}/releases/download/$TAG/php-linux-x86_64
              chmod +x php
              sudo mv php /usr/local/bin/php
              php -v
          \`\`\`

          Coverage with pcov (recommended, 10-100x faster than xdebug):

          \`\`\`yaml
          - run: |
              curl -fsSL -o pcov.so https://github.com/${{ github.repository }}/releases/download/$TAG/pcov-linux-x86_64.so
              php -d zend_extension=\$PWD/pcov.so -d pcov.enabled=1 vendor/bin/pest --coverage
          \`\`\`

          Coverage with xdebug (or step-debugging):

          \`\`\`yaml
          - run: |
              curl -fsSL -o xdebug.so https://github.com/${{ github.repository }}/releases/download/$TAG/xdebug-linux-x86_64.so
              php -d zend_extension=\$PWD/xdebug.so -d xdebug.mode=coverage vendor/bin/pest --coverage
          \`\`\`"
