name: Build static PHP

on:
  # Manual trigger for one-off rebuilds.
  workflow_dispatch:
  # Auto-rebuild whenever the workflow itself changes on main.
  # Keeps the published binaries in sync with the build config.
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
  # Weekly catch-up to pick up new PHP patches (8.3.x, 8.4.x, 8.5.x)
  # and SPC nightly updates without anyone touching the repo.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    name: PHP ${{ matrix.php_version }}
    # PHP compilation is CPU-bound. -16 keeps each matrix arm under ~10 min
    # versus ~30 on base. Per pla-stack sizing policy.
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.3', '8.4', '8.5']
    env:
      # Link against glibc instead of musl. musl static binaries
      # cannot dlopen shared extensions (it has no dlopen impl).
      # glibc-linked binaries can. Every Ubuntu / Debian / Depot
      # runner ships glibc, so the binary stays portable across
      # any standard CI runner.
      SPC_LIBC: glibc
      # Static extensions baked into the binary. Tuned to match what
      # Laravel apps actually need so the binary covers the common
      # CI workload (lint, phpstan, pint, tests against MySQL /
      # Postgres / SQLite / Redis) without falling back to a
      # container.
      # Note: `mbregex` is a static-php-cli virtual extension that pulls
      # oniguruma into mbstring. Without it SPC builds mbstring with
      # `--disable-mbregex`, which strips mb_split / mb_ereg / mb_ereg_match
      # etc. Laravel's Illuminate\Support\Str uses mb_split, so its absence
      # breaks any Laravel boot path.
      SPC_STATIC_EXTENSIONS: apcu,bcmath,calendar,ctype,curl,dom,exif,fileinfo,filter,gd,gmp,iconv,imagick,intl,mbregex,mbstring,mysqli,opcache,openssl,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,pgsql,phar,posix,redis,session,simplexml,soap,sockets,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib
      # Shared extensions built as separate .so files. SPC only
      # supports xdebug and pcov as shared modules, never static.
      # Both are zero-cost when not loaded, opt-in when needed.
      SPC_SHARED_EXTENSIONS: xdebug,pcov
    steps:
      - uses: actions/checkout@v6

      - name: Install static-php-cli
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            -o spc https://dl.static-php.dev/static-php-cli/spc-bin/nightly/spc-linux-x86_64
          chmod +x spc
          ./spc --version

      - name: Install build dependencies
        run: ./spc doctor --auto-fix

      - name: Cache spc sources
        uses: actions/cache@v5
        with:
          path: |
            downloads
            source
          key: spc-${{ matrix.php_version }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Download sources
        run: |
          ./spc download \
            --with-php=${{ matrix.php_version }} \
            --for-extensions="$SPC_STATIC_EXTENSIONS,$SPC_SHARED_EXTENSIONS" \
            --prefer-pre-built

      - name: Build CLI + shared extensions
        run: |
          ./spc build "$SPC_STATIC_EXTENSIONS" \
            --build-cli \
            --build-shared="$SPC_SHARED_EXTENSIONS"

      - name: Verify static binary
        run: |
          set -o pipefail
          ls -la buildroot/bin/ buildroot/modules/
          ./buildroot/bin/php -v
          ./buildroot/bin/php -m
          ./buildroot/bin/php -r 'echo "json: ", json_encode(["ok" => true]), PHP_EOL;'
          # opcache registers under "Zend OPcache" (with a space) in [Zend Modules],
          # so --ri opcache is unreliable. extension_loaded normalises the name.
          ./buildroot/bin/php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);'
          # mbregex is a virtual SPC extension that enables oniguruma inside
          # mbstring. It does not register as its own module, so we probe it
          # by calling mb_split. Laravel's Str helpers depend on this.
          ./buildroot/bin/php -r 'exit(function_exists("mb_split") && count(mb_split(",", "a,b,c")) === 3 ? 0 : 1);'
          ./buildroot/bin/php -r 'exit(extension_loaded("imagick") && class_exists("Imagick") ? 0 : 1);'

      - name: Verify shared extensions load
        # xdebug is a Zend extension. pcov is a regular PHP extension.
        # Each --ri call exits non-zero if the .so does not register, so
        # this step fails loudly if either module is broken.
        run: |
          set -o pipefail
          echo "=== xdebug ==="
          ./buildroot/bin/php -d "zend_extension=$PWD/buildroot/modules/xdebug.so" --ri xdebug
          echo "=== pcov ==="
          ./buildroot/bin/php -d "extension=$PWD/buildroot/modules/pcov.so" --ri pcov

      - name: Capture exact PHP version
        id: ver
        run: |
          exact=$(./buildroot/bin/php -r 'echo PHP_VERSION;')
          echo "exact=$exact" >> "$GITHUB_OUTPUT"
          echo "Built PHP $exact"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp buildroot/bin/php dist/php-linux-x86_64
          cp buildroot/modules/xdebug.so dist/xdebug-linux-x86_64.so
          cp buildroot/modules/pcov.so dist/pcov-linux-x86_64.so
          (cd dist && sha256sum php-linux-x86_64 xdebug-linux-x86_64.so pcov-linux-x86_64.so > SHA256SUMS)
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: php-${{ matrix.php_version }}-linux-x86_64-${{ steps.ver.outputs.exact }}
          path: dist/
          if-no-files-found: error

      - name: Publish immutable release and update channel pointer
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: php-${{ steps.ver.outputs.exact }}
          EXACT: ${{ steps.ver.outputs.exact }}
          SERIES: ${{ matrix.php_version }}
          EXTENSIONS_LIST: ${{ env.SPC_STATIC_EXTENSIONS }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # The organization enforces immutable releases, so each PHP patch is
        # published exactly once under php-<version> and is never edited or
        # re-uploaded. A rebuild of an existing patch is a no-op on the release.
        # The mutable channels/<series> pointer is repointed on every run, so
        # the action always resolves the newest binary without overwriting any
        # release. See the channels branch for the pointer format.
        run: |
          set -euo pipefail

          BASE="$GITHUB_SERVER_URL/$REPO/releases/download/$TAG"

          cat > release-notes.md <<EOF
          Built by static-php-cli on $(date -u +%FT%TZ)

          PHP: \`$EXACT\` (series \`$SERIES\`)
          Static extensions: \`$EXTENSIONS_LIST\`
          Shared extensions: \`xdebug\`, \`pcov\`
          Runner: \`depot-ubuntu-24.04-16\`
          Workflow run: $RUN_URL

          Immutable release. The composite action resolves the newest build per
          series from the channels branch, so consumers do not pin this tag:

          ~~~yaml
          - uses: $REPO@v1
            with:
              php-version: '$SERIES'
          ~~~

          ## Manual install (no GitHub Actions)

          Verifies the binary against \`SHA256SUMS\`:

          ~~~bash
          BASE=$BASE
          curl -fsSL -O "\$BASE/php-linux-x86_64"
          curl -fsSL -O "\$BASE/SHA256SUMS"
          # Pipe the matching line into \`-c\` rather than using
          # \`--ignore-missing\`, which exits 0 even when nothing matched.
          grep ' php-linux-x86_64\$' SHA256SUMS | sha256sum -c -
          chmod +x php-linux-x86_64
          sudo mv php-linux-x86_64 /usr/local/bin/php
          php -v
          ~~~

          Coverage (pcov is 10-100x faster than xdebug):

          ~~~bash
          curl -fsSL -o pcov.so "$BASE/pcov-linux-x86_64.so"
          php -d extension=\$PWD/pcov.so -d pcov.enabled=1 vendor/bin/pest --coverage

          curl -fsSL -o xdebug.so "$BASE/xdebug-linux-x86_64.so"
          php -d zend_extension=\$PWD/xdebug.so -d xdebug.mode=coverage vendor/bin/pest --coverage
          ~~~
          EOF

          ASSETS=(
            dist/php-linux-x86_64
            dist/xdebug-linux-x86_64.so
            dist/pcov-linux-x86_64.so
            dist/SHA256SUMS
          )

          # Decide whether this immutable release already exists. gh exits
          # non-zero both when the release is absent and on a transient API
          # error, so capture the output and only treat a real 404 as "not
          # published". Mistaking a rate-limit or 5xx for "absent" would route
          # into create over an existing immutable tag, which 422s.
          need_create=true
          view_err="$(mktemp)"
          if view_json="$(gh release view "$TAG" --json isDraft,assets 2>"$view_err")"; then
            if [[ "$(jq -r '.isDraft' <<< "$view_json")" == "true" ]]; then
              # gh creates the release, uploads assets, then finalizes. An
              # interrupted run (build concurrency cancels in-progress arms) can
              # leave a draft whose asset URLs 404 for the public and whose tag
              # is not yet locked. Delete it and republish cleanly rather than
              # repointing the channel at an unreachable release.
              echo "::warning::release $TAG exists as an unpublished draft (interrupted publish). Deleting and republishing."
              gh release delete "$TAG" --yes
            else
              # Published and immutable. Confirm every asset is present before
              # repointing, so a partial prior publish cannot strand the pointer
              # on a broken release.
              present="$(jq -r '.assets[].name' <<< "$view_json")"
              for asset in php-linux-x86_64 xdebug-linux-x86_64.so pcov-linux-x86_64.so SHA256SUMS; do
                grep -qx "$asset" <<< "$present" \
                  || { echo "::error::existing release $TAG is missing asset $asset"; exit 1; }
              done
              need_create=false
              echo "Release $TAG already exists with all assets (immutable). Skipping upload."

              # Immutability forbids updating published assets, so a rebuild that
              # produced different bytes for this same patch can never ship. Warn
              # so the no-op is visible instead of silently discarding the build.
              pubdir="$(mktemp -d)"
              if gh release download "$TAG" --pattern SHA256SUMS --dir "$pubdir" --clobber 2>/dev/null \
                 && ! diff -q "$pubdir/SHA256SUMS" dist/SHA256SUMS >/dev/null 2>&1; then
                echo "::warning::rebuilt $TAG differs from the published immutable release. Immutability blocks updating its assets, so these bytes will not ship. Bump the PHP patch to release new binaries."
              fi
              rm -rf "$pubdir"
            fi
          elif grep -qiE 'release not found|HTTP 404|Not Found' "$view_err"; then
            : # genuinely not published yet, fall through to create
          else
            echo "::error::could not determine whether release $TAG exists:"
            cat "$view_err"
            rm -f "$view_err"
            exit 1
          fi
          rm -f "$view_err"

          if [[ "$need_create" == "true" ]]; then
            # Immutable releases lock their assets at publish, so every asset must
            # be attached in this one create call (a later upload is rejected).
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "PHP $EXACT (static, linux x86_64)" \
              --notes-file release-notes.md
          fi

          # Never regress the channel. A re-run or a cached older source can build
          # an older patch than the channel already serves (the built version is
          # whatever spc produced, not a function of the checked-out commit), so
          # advance only. A non-php-* pointer (the latest-* seed) always advances.
          current_base="$(gh api "repos/$REPO/contents/$SERIES?ref=channels" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null | head -n1 | tr -d '[:space:]' || true)"
          case "$current_base" in
            */php-*)
              current_ver="${current_base##*/php-}"
              newest="$(printf '%s\n%s\n' "$current_ver" "$EXACT" | sort -V | tail -n1)"
              if [[ "$current_ver" != "$EXACT" && "$newest" == "$current_ver" ]]; then
                echo "::warning::channels/$SERIES already points at php-$current_ver, newer than this build's php-$EXACT. Leaving the pointer unchanged."
                echo "Pointer channels/$SERIES left at php-$current_ver"
                exit 0
              fi
              ;;
          esac

          # Repoint the channel for this series at the release just published.
          # Matrix arms each write a different file (channels/8.3, 8.4, 8.5) but
          # commit to the same channels ref, so a sibling arm can move the branch
          # head between our SHA read and our write (a 409). Retry only that
          # conflict, and surface any other failure (auth, branch protection,
          # 422) immediately rather than burning retries on a misleading message.
          ENCODED="$(printf '%s\n' "$BASE" | base64 | tr -d '\n')"
          updated=false
          for attempt in 1 2 3 4 5; do
            read_err="$(mktemp)"
            if obj="$(gh api "repos/$REPO/contents/$SERIES?ref=channels" 2>"$read_err")"; then
              CURRENT_SHA="$(jq -r '.sha // empty' <<< "$obj")"
            elif grep -qiE 'HTTP 404|Not Found' "$read_err"; then
              CURRENT_SHA="" # file absent, this is the first write
            else
              echo "Could not read channels/$SERIES SHA (attempt $attempt), retrying:"
              cat "$read_err"
              rm -f "$read_err"
              sleep "$((attempt * 3))"
              continue
            fi
            rm -f "$read_err"

            put_args=(-f "message=chore(channels): point $SERIES at $TAG" -f "content=$ENCODED" -f branch=channels)
            [[ -n "$CURRENT_SHA" ]] && put_args+=(-f "sha=$CURRENT_SHA")

            put_err="$(mktemp)"
            if gh api -X PUT "repos/$REPO/contents/$SERIES" "${put_args[@]}" >/dev/null 2>"$put_err"; then
              rm -f "$put_err"
              updated=true
              break
            fi
            if grep -qiE 'HTTP 409|HTTP 422|does not match|is at|conflict' "$put_err"; then
              echo "channels/$SERIES write raced a concurrent arm (attempt $attempt). Retrying."
              rm -f "$put_err"
              sleep "$((attempt * 3))"
            else
              echo "::error::failed to update channels/$SERIES (not a retryable conflict):"
              cat "$put_err"
              rm -f "$put_err"
              exit 1
            fi
          done
          if [[ "$updated" != "true" ]]; then
            echo "::error::failed to update channels/$SERIES after retries"
            exit 1
          fi
          echo "Pointer channels/$SERIES -> $BASE"
