name: Release

# Cuts an action release whenever CHANGELOG.md gains a new `## vX.Y.Z`
# header on main. Source of truth is the top header; the workflow:
#   1. Validates the header shape (also runs on PR so format drift fails fast).
#   2. Guards that PRs touching action.yml also bump the CHANGELOG header.
#   3. Per-artifact idempotency: each of {immutable tag, sliding tag,
#      GitHub Release} is reconciled independently, so a partial failure
#      in any one step can be repaired by re-running the workflow.
#   4. Extracts the markdown block between the matching version header and
#      the next `## ` header of any kind for release notes.
#
# Trigger is path-filtered to CHANGELOG.md so unrelated pushes are a no-op.
# `workflow_dispatch` is exposed for retroactive releases — pass `--ref`
# to point at the actual release commit if main has moved on.

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'CHANGELOG.md'
      - 'action.yml'
      - 'setup-php-vendor/action.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate changelog header
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Check top header shape
        run: |
          set -euo pipefail
          header=$(grep -m1 -E '^## ' CHANGELOG.md || true)
          if [[ -z "$header" ]]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## ' header"
            exit 1
          fi
          if ! [[ "$header" =~ ^##\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=CHANGELOG.md::Top header must be '## vX.Y.Z' exactly (got: $header)"
            exit 1
          fi
          echo "OK: $header"

  guard-changelog-bump:
    name: Guard CHANGELOG bump when action.yml changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Need both PR head and base for the diff and the base-CHANGELOG read.
          fetch-depth: 0

      - name: Check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA...HEAD" -- action.yml setup-php-vendor/action.yml)
          if [[ -z "$changed" ]]; then
            echo "No action.yml changes in this PR — bump guard not applicable."
            exit 0
          fi
          echo "PR modifies composite action files:"
          printf '  - %s\n' $changed

          head_version=$(grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+$' CHANGELOG.md | sed 's/^## v//')
          # `git show base:CHANGELOG.md` reads the file as it stood on the PR base.
          base_version=$(git show "$BASE_SHA:CHANGELOG.md" \
            | grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^## v//')

          echo "Top version on base ($BASE_SHA): v$base_version"
          echo "Top version on PR head:          v$head_version"

          if [[ "$head_version" == "$base_version" ]]; then
            echo "::error file=CHANGELOG.md::Composite action files changed but the top CHANGELOG header is still v$head_version. Add a new '## vX.Y.Z' block at the top of CHANGELOG.md (see the Versioning section at the bottom for the semver rules) so the release workflow can publish your change."
            exit 1
          fi
          echo "OK: bumped v$base_version -> v$head_version"

  release:
    name: Cut release
    needs: validate
    # Hard-gate to main only. Without the ref check, a maintainer dispatching
    # the workflow from a feature branch would publish vX.Y.Z and move vX
    # from unmerged code. Codex flagged this — keep it.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so we can peel vX.Y.Z to its commit locally.
          fetch-depth: 0

      - name: Read top version
        id: ver
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+$' CHANGELOG.md | sed 's/^## v//')
          major=${version%%.*}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "Top version: v$version (major: v$major)"

      - name: Check immutable tag state
        id: tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Three outcomes:
          #   absent          → create it on this commit
          #   present_here    → tag already exists at GITHUB_SHA, reconcile
          #                      downstream artifacts (sliding tag, release).
          #                      Partial-failure recovery path.
          #   present_elsewhere → tag exists at a different commit, this push
          #                       is not a release (typo fix to old notes,
          #                       etc.) → no-op the whole job.
          if ! git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            echo "v$VERSION does not exist yet — will create."
            exit 0
          fi
          tag_commit=$(git rev-list -n 1 "v$VERSION")
          if [[ "$tag_commit" == "$GITHUB_SHA" ]]; then
            echo "state=present_here" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already at $GITHUB_SHA — reconciling downstream artifacts."
          else
            echo "state=present_elsewhere" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already at $tag_commit (not current $GITHUB_SHA) — this push is not a release. No-op."
          fi

      - name: Extract release notes
        if: steps.tag.outputs.state != 'present_elsewhere'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            /^## / {
              if (capture) exit
              if ($0 == "## v" ver) { capture = 1; next }
            }
            capture { print }
          ' CHANGELOG.md \
            | awk 'NF { found=1 } found' \
            | awk '{ lines[NR] = $0 } END { last = NR; while (last > 0 && lines[last] == "") last--; for (i = 1; i <= last; i++) print lines[i] }' \
            > release-notes.md
          echo "::group::release-notes.md"
          cat release-notes.md
          echo "::endgroup::"

      - name: Create immutable tag
        if: steps.tag.outputs.state == 'absent'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          echo "Tagged v$VERSION at $GITHUB_SHA"

      - name: Move sliding tag
        if: steps.tag.outputs.state != 'present_elsewhere'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAJOR: ${{ steps.ver.outputs.major }}
        run: |
          set -euo pipefail
          # Idempotent: if the sliding tag already points at GITHUB_SHA, no-op.
          # Otherwise force-move (PATCH) or create (POST). Same shape build.yml
          # uses for the latest-X.Y tags.
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/v$MAJOR" --jq .object.sha 2>/dev/null || true)
          if [[ -z "$current" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/v$MAJOR" -f sha="$GITHUB_SHA" >/dev/null
            echo "Created sliding tag v$MAJOR at $GITHUB_SHA"
          elif [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "Sliding tag v$MAJOR already at $GITHUB_SHA — no-op"
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v$MAJOR" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            echo "Moved sliding tag v$MAJOR: $current → $GITHUB_SHA"
          fi

      - name: Create GitHub Release
        if: steps.tag.outputs.state != 'present_elsewhere'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — no-op"
            exit 0
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md
          echo "Published release v$VERSION"
