name: Test action

on:
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - '.github/workflows/test-action.yml'
  pull_request:
    paths:
      - 'action.yml'
      - '.github/workflows/test-action.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: PHP ${{ matrix.php }} / coverage=${{ matrix.cov }}
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        cov: [none, pcov, xdebug]
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.cov }}

      # Separate step on purpose: exercises $GITHUB_PATH / $GITHUB_ENV
      # actually applying across the step boundary, which is the load-bearing
      # contract of the action.
      - name: Probe
        env:
          MATRIX_PHP: ${{ matrix.php }}
          MATRIX_COV: ${{ matrix.cov }}
        run: |
          set -euo pipefail

          php -v | grep -F "PHP ${MATRIX_PHP}."
          php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);'
          php -r 'exit(count(mb_split(",", "a,b,c")) === 3 ? 0 : 1);'

          case "$MATRIX_COV" in
            pcov)
              php --ini | grep -F "$RUNNER_TEMP/php-ci-static/conf.d"
              php -r 'exit(extension_loaded("pcov") ? 0 : 1);'
              php -m | grep -F pcov
              ;;
            xdebug)
              php --ini | grep -F "$RUNNER_TEMP/php-ci-static/conf.d"
              php -r 'exit(extension_loaded("xdebug") ? 0 : 1);'
              php --ri xdebug | grep -F "mode => coverage"
              ;;
            none)
              # Negative assertions: nothing coverage-related leaks in.
              php -r 'exit(extension_loaded("pcov") ? 1 : 0);'
              php -r 'exit(extension_loaded("xdebug") ? 1 : 0);'
              ;;
          esac

          # The action installs composer into its own bin dir, and
          # $GITHUB_PATH prepends that dir so `composer` resolves to ours
          # (not anything pre-installed on the runner image).
          ACTION_COMPOSER="$RUNNER_TEMP/php-ci-static/bin/composer"
          [[ -x "$ACTION_COMPOSER" ]] \
            || { echo "::error::composer missing from $ACTION_COMPOSER"; exit 1; }
          [[ "$(command -v composer)" == "$ACTION_COMPOSER" ]] \
            || { echo "::error::PATH resolves to $(command -v composer), expected $ACTION_COMPOSER"; exit 1; }
          composer --version | grep -F "Composer version"

  ini-values:
    name: ini-values composes with coverage
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          php-version: '8.4'
          coverage: pcov
          ini-values: memory_limit=512M, opcache.enable_cli=1

      - name: Probe
        run: |
          set -euo pipefail

          # custom.ini applied
          [[ "$(php -r 'echo ini_get("memory_limit");')" == "512M" ]] \
            || { echo "::error::memory_limit not 512M"; exit 1; }
          [[ "$(php -r 'echo ini_get("opcache.enable_cli");')" == "1" ]] \
            || { echo "::error::opcache.enable_cli not 1"; exit 1; }

          # Coverage still loaded alongside the custom ini.
          php -r 'exit(extension_loaded("pcov") ? 0 : 1);'

          # Both files live in the scan dir.
          php --ini | grep -F "$RUNNER_TEMP/php-ci-static/conf.d"
          ls "$RUNNER_TEMP/php-ci-static/conf.d/coverage.ini"
          ls "$RUNNER_TEMP/php-ci-static/conf.d/custom.ini"

  ini-values-preserves-commas-in-values:
    name: ini-values preserves commas inside values
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          php-version: '8.4'
          ini-values: |
            memory_limit=512M
            disable_functions=exec,passthru

      - name: Probe
        run: |
          set -euo pipefail

          [[ "$(php -r 'echo ini_get("memory_limit");')" == "512M" ]] \
            || { echo "::error::memory_limit not 512M"; exit 1; }

          # The whole `exec,passthru` string survived the parser.
          got="$(php -r 'echo ini_get("disable_functions");')"
          [[ "$got" == "exec,passthru" ]] \
            || { echo "::error::disable_functions lost comma: got '$got'"; exit 1; }

  ini-values-rejects-bad-input:
    name: ini-values rejects malformed input
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Bad directive name fails validation
        id: bad
        continue-on-error: true
        uses: ./
        with:
          php-version: '8.4'
          ini-values: not a directive=value

      - name: Assert the previous step failed
        run: |
          [[ "${{ steps.bad.outcome }}" == "failure" ]] \
            || { echo "::error::expected validation to fail, got '${{ steps.bad.outcome }}'"; exit 1; }
