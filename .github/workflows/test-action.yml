name: Test action

on:
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - '.github/workflows/test-action.yml'
  pull_request:
    paths:
      - 'action.yml'
      - '.github/workflows/test-action.yml'
  workflow_dispatch:

concurrency:
  group: test-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: PHP ${{ matrix.php }} / coverage=${{ matrix.cov }}
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        cov: [none, pcov, xdebug]
        composer: ['false']
        # Add 3 composer:true cells (one per PHP version) at
        # coverage: none. Composer install is PHP-version-agnostic
        # so a single per-version probe is enough.
        include:
          - { php: '8.3', cov: none, composer: 'true' }
          - { php: '8.4', cov: none, composer: 'true' }
          - { php: '8.5', cov: none, composer: 'true' }
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.cov }}
          composer: ${{ matrix.composer }}

      # Separate step on purpose: exercises $GITHUB_PATH / $GITHUB_ENV
      # actually applying across the step boundary, which is the load-bearing
      # contract of the action.
      - name: Probe
        env:
          MATRIX_PHP: ${{ matrix.php }}
          MATRIX_COV: ${{ matrix.cov }}
          MATRIX_COMPOSER: ${{ matrix.composer }}
        run: |
          set -euo pipefail

          php -v | grep -F "PHP ${MATRIX_PHP}."
          php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);'
          php -r 'exit(count(mb_split(",", "a,b,c")) === 3 ? 0 : 1);'

          case "$MATRIX_COV" in
            pcov)
              php --ini | grep -F "$RUNNER_TEMP/php-ci-static/conf.d"
              php -r 'exit(extension_loaded("pcov") ? 0 : 1);'
              php -m | grep -F pcov
              ;;
            xdebug)
              php --ini | grep -F "$RUNNER_TEMP/php-ci-static/conf.d"
              php -r 'exit(extension_loaded("xdebug") ? 0 : 1);'
              php --ri xdebug | grep -F "mode => coverage"
              ;;
            none)
              # Negative assertions: nothing coverage-related leaks in.
              php -r 'exit(extension_loaded("pcov") ? 1 : 0);'
              php -r 'exit(extension_loaded("xdebug") ? 1 : 0);'
              ;;
          esac

          ACTION_COMPOSER="$RUNNER_TEMP/php-ci-static/bin/composer"
          if [[ "$MATRIX_COMPOSER" == "true" ]]; then
            # Positive: the action installed composer into its own bin
            # dir, and $GITHUB_PATH prepends that dir so `composer`
            # resolves to ours (not anything pre-installed on the runner
            # image).
            [[ -x "$ACTION_COMPOSER" ]] \
              || { echo "::error::composer missing from $ACTION_COMPOSER"; exit 1; }
            [[ "$(command -v composer)" == "$ACTION_COMPOSER" ]] \
              || { echo "::error::PATH resolves to $(command -v composer), expected $ACTION_COMPOSER"; exit 1; }
            composer --version | grep -F "Composer version"
          else
            # Negative: the action's bin must not contain composer.
            # PATH-level composer is fine (Depot images ship one).
            [[ ! -e "$ACTION_COMPOSER" ]] \
              || { echo "::error::$ACTION_COMPOSER exists but composer input was false"; exit 1; }
          fi
