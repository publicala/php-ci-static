name: Test action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-tooling:
    name: Lint tooling
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

  matrix:
    name: PHP ${{ matrix.php }} / coverage=${{ matrix.cov }}
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        cov: [none, pcov, xdebug]
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.cov }}

      # Separate step on purpose: exercises $GITHUB_PATH / $GITHUB_ENV
      # actually applying across the step boundary, which is the load-bearing
      # contract of the action.
      - name: Probe
        env:
          MATRIX_PHP: ${{ matrix.php }}
          MATRIX_COV: ${{ matrix.cov }}
        run: |
          set -euo pipefail

          php -v | grep -F "PHP ${MATRIX_PHP}."
          php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);'
          php -r 'exit(count(mb_split(",", "a,b,c")) === 3 ? 0 : 1);'

          case "$MATRIX_COV" in
            pcov)
              php --ini | grep -F "$RUNNER_TEMP/php-ci-static/conf.d"
              php -r 'exit(extension_loaded("pcov") ? 0 : 1);'
              php -m | grep -F pcov
              ;;
            xdebug)
              php --ini | grep -F "$RUNNER_TEMP/php-ci-static/conf.d"
              php -r 'exit(extension_loaded("xdebug") ? 0 : 1);'
              php --ri xdebug | grep -F "mode => coverage"
              ;;
            none)
              # Negative assertions: nothing coverage-related leaks in.
              php -r 'exit(extension_loaded("pcov") ? 1 : 0);'
              php -r 'exit(extension_loaded("xdebug") ? 1 : 0);'
              ;;
          esac

          # The action installs composer into its own bin dir, and
          # $GITHUB_PATH prepends that dir so `composer` resolves to ours
          # (not anything pre-installed on the runner image).
          ACTION_COMPOSER="$RUNNER_TEMP/php-ci-static/bin/composer"
          [[ -x "$ACTION_COMPOSER" ]] \
            || { echo "::error::composer missing from $ACTION_COMPOSER"; exit 1; }
          [[ "$(command -v composer)" == "$ACTION_COMPOSER" ]] \
            || { echo "::error::PATH resolves to $(command -v composer), expected $ACTION_COMPOSER"; exit 1; }
          composer --version | grep -F "Composer version"

  ini-values:
    name: ini-values composes with coverage
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          php-version: '8.4'
          coverage: pcov
          ini-values: memory_limit=512M, opcache.enable_cli=1

      - name: Probe
        run: |
          set -euo pipefail

          # custom.ini applied
          [[ "$(php -r 'echo ini_get("memory_limit");')" == "512M" ]] \
            || { echo "::error::memory_limit not 512M"; exit 1; }
          [[ "$(php -r 'echo ini_get("opcache.enable_cli");')" == "1" ]] \
            || { echo "::error::opcache.enable_cli not 1"; exit 1; }

          # Coverage still loaded alongside the custom ini.
          php -r 'exit(extension_loaded("pcov") ? 0 : 1);'

          # Both files live in the scan dir.
          php --ini | grep -F "$RUNNER_TEMP/php-ci-static/conf.d"
          ls "$RUNNER_TEMP/php-ci-static/conf.d/coverage.ini"
          ls "$RUNNER_TEMP/php-ci-static/conf.d/custom.ini"

  ini-values-preserves-commas-in-values:
    name: ini-values preserves commas inside values
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          php-version: '8.4'
          ini-values: |
            memory_limit=512M
            disable_functions=exec,passthru

      - name: Probe
        run: |
          set -euo pipefail

          [[ "$(php -r 'echo ini_get("memory_limit");')" == "512M" ]] \
            || { echo "::error::memory_limit not 512M"; exit 1; }

          # The whole `exec,passthru` string survived the parser.
          got="$(php -r 'echo ini_get("disable_functions");')"
          [[ "$got" == "exec,passthru" ]] \
            || { echo "::error::disable_functions lost comma: got '$got'"; exit 1; }

  ini-values-supports-quoted-values:
    name: ini-values supports quoted values (setup-php compat)
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          php-version: '8.4'
          # Double quotes, single quotes, and a value that contains a literal
          # `key=value` substring (the case smart-at-boundary can't handle).
          ini-values: memory_limit=512M, disable_functions="exec,passthru", error_log='/tmp/foo=bar.log'

      - name: Probe
        run: |
          set -euo pipefail

          [[ "$(php -r 'echo ini_get("memory_limit");')" == "512M" ]] \
            || { echo "::error::memory_limit not 512M"; exit 1; }

          got="$(php -r 'echo ini_get("disable_functions");')"
          [[ "$got" == "exec,passthru" ]] \
            || { echo "::error::disable_functions: got '$got'"; exit 1; }

          got="$(php -r 'echo ini_get("error_log");')"
          [[ "$got" == "/tmp/foo=bar.log" ]] \
            || { echo "::error::error_log: got '$got'"; exit 1; }

  ini-values-preserves-literal-quote-chars:
    name: ini-values preserves apostrophes inside values
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          php-version: '8.4'
          # `'` appears inside an unquoted value — must not be treated as a
          # quote delimiter. Same for a literal `"` further down.
          ini-values: |
            error_log=/tmp/o'reilly.log
            sendmail_path=/usr/sbin/sendmail -t -i

      - name: Probe
        run: |
          set -euo pipefail

          got="$(php -r 'echo ini_get("error_log");')"
          [[ "$got" == "/tmp/o'reilly.log" ]] \
            || { echo "::error::error_log lost apostrophe: got '$got'"; exit 1; }

          got="$(php -r 'echo ini_get("sendmail_path");')"
          [[ "$got" == "/usr/sbin/sendmail -t -i" ]] \
            || { echo "::error::sendmail_path: got '$got'"; exit 1; }

  ini-values-rejects-bad-input:
    name: ini-values rejects malformed input
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Bad directive name fails validation
        id: bad
        # pla-stack:allow-continue-on-error negative test — this step is meant to fail; the next step asserts steps.bad.outcome == failure
        continue-on-error: true
        uses: ./
        with:
          php-version: '8.4'
          ini-values: not a directive=value

      - name: Assert the previous step failed
        run: |
          [[ "${{ steps.bad.outcome }}" == "failure" ]] \
            || { echo "::error::expected validation to fail, got '${{ steps.bad.outcome }}'"; exit 1; }

  setup-php-vendor-key-shape:
    name: setup-php-vendor cache-key has runner-os/php-version/hash shape
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Seed deterministic composer fixtures
        run: |
          set -euo pipefail
          echo '{"name":"pub/fixture"}' > composer.json
          echo '{"content-hash":"fixture"}' > composer.lock

      # Cache miss is fine here; we're asserting the *key shape*, not restore behavior.
      - id: setup
        uses: ./setup-php-vendor
        with:
          php-version: '8.4'
          fail-on-cache-miss: 'false'

      - name: Assert key shape and cache-hit
        env:
          KEY: ${{ steps.setup.outputs.cache-key }}
          HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # GitHub's hashFiles uses SHA256 of concatenated SHA256s; we don't try to
          # reproduce it exactly — just assert the prefix and that the suffix is non-empty.
          [[ "$KEY" == composer-Linux-php-8.4-* ]] \
            || { echo "::error::unexpected key prefix: $KEY"; exit 1; }
          [[ "${KEY#composer-Linux-php-8.4-}" =~ ^[0-9a-f]{40,}$ ]] \
            || { echo "::error::missing or malformed hash suffix in $KEY"; exit 1; }
          [[ "$HIT" != "true" ]] \
            || { echo "::error::expected cache-hit=false on first run, got '$HIT'"; exit 1; }

      - name: php-version flows into the key
        run: |
          set -euo pipefail
          # Different PHP version → different key, same hash suffix.
          :  # asserted by the matrix below (separate job)

  setup-php-vendor-php-version-in-key:
    name: setup-php-vendor php-version partitions the key
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - run: |
          echo '{"name":"pub/fixture"}' > composer.json
          echo '{"content-hash":"fixture"}' > composer.lock

      - id: a
        uses: ./setup-php-vendor
        with:
          php-version: '8.3'
          fail-on-cache-miss: 'false'

      - id: b
        uses: ./setup-php-vendor
        with:
          php-version: '8.4'
          fail-on-cache-miss: 'false'

      - name: Keys differ only in php-version segment
        env:
          KEY_A: ${{ steps.a.outputs.cache-key }}
          KEY_B: ${{ steps.b.outputs.cache-key }}
        run: |
          set -euo pipefail
          [[ "$KEY_A" == composer-Linux-php-8.3-* ]] || { echo "::error::A: $KEY_A"; exit 1; }
          [[ "$KEY_B" == composer-Linux-php-8.4-* ]] || { echo "::error::B: $KEY_B"; exit 1; }
          # Suffix (the hash) is identical because composer.json/lock are identical.
          [[ "${KEY_A#composer-Linux-php-8.3-}" == "${KEY_B#composer-Linux-php-8.4-}" ]] \
            || { echo "::error::hash suffix should match across php-version: $KEY_A vs $KEY_B"; exit 1; }

  setup-php-vendor-dependency-path:
    name: setup-php-vendor honors dependency-path
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Seed fixture in a non-root location
        run: |
          set -euo pipefail
          mkdir -p packages/api
          echo '{"name":"pub/api"}' > packages/api/composer.json
          echo '{"content-hash":"api"}' > packages/api/composer.lock
          mkdir -p packages/web
          echo '{"name":"pub/web"}' > packages/web/composer.json
          echo '{"content-hash":"web"}' > packages/web/composer.lock

      - id: api
        uses: ./setup-php-vendor
        with:
          php-version: '8.4'
          fail-on-cache-miss: 'false'
          dependency-path: |
            packages/api/composer.json
            packages/api/composer.lock

      - id: web
        uses: ./setup-php-vendor
        with:
          php-version: '8.4'
          fail-on-cache-miss: 'false'
          dependency-path: |
            packages/web/composer.json
            packages/web/composer.lock

      - name: Two different paths produce two different keys
        env:
          KEY_API: ${{ steps.api.outputs.cache-key }}
          KEY_WEB: ${{ steps.web.outputs.cache-key }}
        run: |
          set -euo pipefail
          [[ "$KEY_API" != "$KEY_WEB" ]] \
            || { echo "::error::dependency-path did not partition the key: $KEY_API"; exit 1; }

  setup-php-vendor-empty-deps-fails:
    name: setup-php-vendor fails when dependency-path matches nothing
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - id: bad
        # pla-stack:allow-continue-on-error negative test — this step is meant to fail; the next step asserts steps.bad.outcome == failure
        continue-on-error: true
        uses: ./setup-php-vendor
        with:
          php-version: '8.4'
          fail-on-cache-miss: 'false'
          dependency-path: this-file-does-not-exist.json

      - run: |
          [[ "${{ steps.bad.outcome }}" == "failure" ]] \
            || { echo "::error::expected step to fail on empty hash, got '${{ steps.bad.outcome }}'"; exit 1; }

  setup-php-vendor-fail-on-cache-miss:
    name: setup-php-vendor fail-on-cache-miss=true fails on miss
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Unique-per-run hash so the cache cannot hit.
      - name: Seed unique fixture
        run: |
          set -euo pipefail
          echo "{\"nonce\":\"${{ github.run_id }}-${{ github.run_attempt }}\"}" > composer.json
          echo '{"content-hash":"none"}' > composer.lock

      - id: bad
        # pla-stack:allow-continue-on-error negative test — this step is meant to fail; the next step asserts steps.bad.outcome == failure
        continue-on-error: true
        uses: ./setup-php-vendor
        with:
          php-version: '8.4'
          fail-on-cache-miss: 'true'

      - run: |
          [[ "${{ steps.bad.outcome }}" == "failure" ]] \
            || { echo "::error::expected fail-on-cache-miss=true to fail on miss, got '${{ steps.bad.outcome }}'"; exit 1; }

  setup-php-vendor-ini-values-passthrough:
    name: setup-php-vendor passes ini-values through to php-ci-static
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - run: |
          echo '{"name":"pub/fixture"}' > composer.json
          echo '{"content-hash":"fixture"}' > composer.lock

      - uses: ./setup-php-vendor
        with:
          php-version: '8.4'
          ini-values: memory_limit=512M
          fail-on-cache-miss: 'false'

      - run: |
          set -euo pipefail
          [[ "$(php -r 'echo ini_get("memory_limit");')" == "512M" ]] \
            || { echo "::error::ini-values not applied"; exit 1; }
