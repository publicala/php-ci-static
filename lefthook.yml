glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    "fix:prettier":
      run: npm run format:staged -- {staged_files}
      glob: "{package.json,package-lock.json,lefthook.yml}"
      stage_fixed: true
    "test:tooling":
      run: npm test
      glob: "{action.yml,setup-php-vendor/action.yml,.github/workflows/**,scripts/**,package.json,package-lock.json,lefthook.yml}"

pre-push:
  parallel: true
  commands:
    "test:tooling":
      run: npm test
